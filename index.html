/* =========================
   🎯 GAME STATE
   ========================= */

const target = airports[Math.floor(Math.random() * airports.length)];
const MAX = 7;

let attempts = 0;
let gameOver = false;
let selectedFromDropdown = false;

/* =========================
   📊 GUESS TRACKER
   ========================= */

const tracker = document.getElementById("guessTracker");
const boxes = [];

for (let i = 0; i < MAX; i++) {
    let b = document.createElement("div");
    b.className = "guessBox";
    tracker.appendChild(b);
    boxes.push(b);
}

/* =========================
   🧭 COMPASS (CLEAN)
   ========================= */

function getDir(a, b) {

    const dx = b.lon - a.lon;
    const dy = b.lat - a.lat;

    const absX = Math.abs(dx);
    const absY = Math.abs(dy);

    const north = dy > 0;
    const east = dx > 0;

    const SMALL = 0.8;

    if (absY < SMALL && absX >= SMALL) {
        return east ? "➡️" : "⬅️";
    }

    if (absX < SMALL && absY >= SMALL) {
        return north ? "⬆️" : "⬇️";
    }

    if (north && east) return "↗️";
    if (north && !east) return "↖️";
    if (!north && east) return "↘️";
    return "↙️";
}

/* =========================
   📦 HINTS
   ========================= */

const hintData = [
["🌍 Continent", () => target.continent],
["🏳️ Country", () => target.country],
["🚗 Dealership", () => target.dealership.exists ? `Yes (${target.dealership.vehicles})` : "No"],
["✈️ Type", () => target.airportType],
["📍 Closest", () => target.closestAirport],
["🖼️ Image", () => `<img src="${target.image}" width="100%">`]
];

const hintDiv = document.getElementById("hints");

hintData.forEach((h, i) => {
    let box = document.createElement("div");
    box.className = "hintBox";
    box.id = "hint" + i;
    box.innerHTML = `<b>${h[0]}</b><br>???`;
    hintDiv.appendChild(box);
});

/* =========================
   🎮 GUESS FUNCTION
   ========================= */

function guess() {

    if (gameOver) return;

    const input = document.getElementById("guessInput");
    const val = input.value.toLowerCase().trim();
    if (!val) return;

    attempts++;
    boxes[attempts - 1].classList.add("used");

    const g = airports.find(a =>
        a.name.toLowerCase() === val ||
        a.code.toLowerCase() === val
    );

    const log = document.getElementById("log");
    let div = document.createElement("div");

    if (!g) {
        div.innerHTML = "❌ Invalid";
    }

    else if (g.code !== target.code) {
        div.innerHTML = `❌ ${g.name} ${getDir(g, target)}`;
    }

    else {
        div.innerHTML = `✅ Correct! ${target.name}`;
        boxes.forEach(b => b.classList.add("correct"));

        gameOver = true;
        input.disabled = true;
    }

    log.appendChild(div);

    /* 📦 unlock hint */
    let i = attempts - 1;
    if (i < hintData.length) {
        let box = document.getElementById("hint" + i);
        box.classList.add("unlocked");
        box.innerHTML = `<b>${hintData[i][0]}</b><br>${hintData[i][1]()}`;
    }

    /* 💀 lose */
    if (attempts >= MAX && !gameOver) {
        gameOver = true;

        let end = document.createElement("div");
        end.innerHTML = `💀 Answer: ${target.name}`;
        log.appendChild(end);

        input.disabled = true;
    }

    input.value = "";
    selectedFromDropdown = false;
}

/* =========================
   ⌨️ ENTER KEY (2 STEP)
   ========================= */

const input = document.getElementById("guessInput");
const sug = document.getElementById("suggestions");

input.addEventListener("keydown", e => {

    if (e.key === "Enter") {

        const suggestions = document.querySelectorAll(".suggestion");

        if (!selectedFromDropdown && suggestions.length > 0) {
            input.value = suggestions[0].textContent;
            selectedFromDropdown = true;
            return;
        }

        guess();
    }
});

/* =========================
   📍 DROPDOWN
   ========================= */

function render() {

    sug.innerHTML = "";
    let v = input.value.toLowerCase();

    selectedFromDropdown = false;

    const list = airports.filter(a =>
        a.name.toLowerCase().startsWith(v) ||
        a.code.toLowerCase().startsWith(v)
    );

    list.forEach(a => {

        let d = document.createElement("div");
        d.className = "suggestion";
        d.textContent = a.name;

        d.onclick = () => {
            input.value = a.name;
            sug.innerHTML = "";
            selectedFromDropdown = true;
        };

        sug.appendChild(d);
    });
}

input.addEventListener("input", render);
input.addEventListener("focus", render);

document.addEventListener("click", e => {
    if (e.target !== input && !sug.contains(e.target)) {
        sug.innerHTML = "";
    }
});
